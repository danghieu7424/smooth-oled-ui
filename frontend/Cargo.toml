[package]
name = "leptos_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- Framework UI ---
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# --- Xử lý API & JSON ---
# reqwest = { version = "0.11", features = ["json"] } # Có thể bỏ nếu đã dùng gloo-net
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.6"
quick-xml = { version = "0.31", features = ["async-tokio"] }
futures = "0.3"

# --- Log & Debug ---
console_log = "1"
log = "0.4"
console_error_panic_hook = "0.1"

# Thêm dependency này để quản lý async trong callback
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
anyhow = "1.0"
getrandom = { version = "0.2", features = ["js"] }

# crypto
base64 = "0.21"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
pulldown-cmark = "0.13.4"
toml = "1.1.4"

# --- WEB-SYS (Khai báo 1 lần duy nhất ở đây) ---
[dependencies.web-sys]
version = "0.3"
features = [
    # ✅ ĐƯA VÀO ĐÂY:
    "Window",
    "Storage",

    # Các thẻ HTML
    "HtmlVideoElement",
    "HtmlMediaElement",   
    "HtmlDivElement",
    "HtmlElement",
    "HtmlInputElement",
    "FileList",
    "File",
    "FormData",
    "MediaError",
    "MediaSourceReadyState",
    
    # Các kiểu dữ liệu DOM
    "Document",
    "Element",            
    "DomRect",
    "TimeRanges",
    "TextTrackList",
    "TextTrack",
    "TextTrackMode",
    
    # Sự kiện
    "MouseEvent",
    "Event",
    "TouchEvent",
    "TouchList",
    "Touch",
    "DragEvent",
    "DataTransfer",

    "MediaSource",       
    "SourceBuffer",      
    "Url",               
    "EventTarget",       
    "CustomEvent",
    "MessageEvent",
    "RequestCredentials",
    "Notification",
    "NotificationPermission",
    "NotificationOptions",
]
